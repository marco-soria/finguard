<header class="app-header">
  <mat-toolbar>
    <h1>FinGuard</h1>
    <div class="app-session">
      <!-- A browser preference, so it shows on /login too. -->
      <button
        matIconButton
        type="button"
        [attr.aria-label]="themeLabel()"
        [matTooltip]="themeLabel()"
        (click)="theme.toggle()"
      >
        <!-- The icon of the theme a click switches to (D-319). -->
        <mat-icon [svgIcon]="theme.effective() === 'dark' ? 'light_mode' : 'dark_mode'" />
      </button>
      @if (auth.isAuthenticated()) {
        @let state = tenant();
        @if (state.status === 'loaded') {
          <p class="app-tenant">{{ state.name }}</p>
        } @else if (state.status === 'error') {
          <p class="app-tenant" role="status">Could not load your organization.</p>
        }
        <button matButton="outlined" type="button" (click)="signOut()">Sign out</button>
      }
    </div>
  </mat-toolbar>
</header>
<main class="app-main">
  <router-outlet />
</main>
<app-site-footer />
