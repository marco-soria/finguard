version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Dependabot's npm ecosystem also covers pnpm (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /src/frontend/finguard-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # PRs wait past pnpm 11's minimumReleaseAge window, or CI fails (R-12)
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors go through `ng update` in a dedicated brief.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
